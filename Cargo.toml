[workspace]
resolver = "3"
members = ["core", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Lytavra Studio"]
repository = "https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "io-util", "time", "net"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
