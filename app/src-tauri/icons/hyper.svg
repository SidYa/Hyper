<!-- Source of the app icon: a game controller (Material Symbols Outlined
     "sports_esports", Apache-2.0, the same glyph as the console-mode button)
     on the wordmark's tile, in the default accent's gradient (#db4df6 →
     #6a4df6 → #553ec5, like the animated logo in Brand.svelte). Regenerate
     every size with:
       pnpm -C app tauri icon src-tauri/icons/hyper.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b44df6"/>
      <stop offset="0.5" stop-color="#6a4df6"/>
      <stop offset="1" stop-color="#4b36c0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="236" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="236" fill="url(#shine)"/>
  <!-- thin inner ring, like the tile's outline in the UI -->
  <rect x="44" y="44" width="936" height="936" rx="218" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
